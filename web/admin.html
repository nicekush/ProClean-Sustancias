<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROClean · Registros</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./production.css"></head><body class="admin"><header><img src="./logo.jpg" alt="PROClean MG"><div>REGISTROS E INDICADORES<small>Super Sucker · Zaldívar</small></div></header><main class="admin"><nav><a href="/">Consulta del operador</a><button id="logout" hidden>Cerrar sesión</button></nav><div id="error" class="error" role="alert" hidden></div><section id="login" class="panel"><h1>Administración</h1><form id="login-form"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="continue">INGRESAR</button></form></section><section id="dashboard" hidden><h1>Registros e indicadores</h1><p>Consultas registradas, no trabajos ejecutados. Horarios de Chile.</p><div class="panel"><form id="filters" class="toolbar"><label>Desde<input id="from" type="date" required></label><label>Hasta (inclusive)<input id="to" type="date" required></label><button type="submit">Consultar</button><button type="button" id="export" disabled>Exportar CSV para Excel</button></form><p id="count" class="secondary"></p><div id="metrics" class="metric-grid"></div></div><div class="panel scroll"><table><thead><tr><th>Fecha</th><th>Operador</th><th>Patente</th><th>Área</th><th>Estado</th><th>Detalle</th></tr></thead><tbody id="rows"></tbody></table><button id="more" hidden>Cargar más</button></div><section id="detail" class="panel" hidden></section></section></main><script type="module" src="./admin.js"></script></body></html>
